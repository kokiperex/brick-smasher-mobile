name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run automated tests
        run: node tests/run-tests.js

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
