<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <meta name="theme-color" content="#071326">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Neon Breaker">
    <title>Neon Breaker</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hud" aria-label="Estado de la partida">
        <div class="hud-stat hud-stat--score">
          <span class="hud-label">PUNTOS</span>
          <strong id="scoreValue">000000</strong>
        </div>
        <div class="hud-stat hud-stat--level">
          <span class="hud-label">NIVEL</span>
          <strong id="levelValue">1 / 40</strong>
        </div>
        <div class="hud-stat hud-stat--lives">
          <span class="hud-label">VIDAS</span>
          <strong id="livesValue" aria-label="3 vidas">♥ ♥ ♥</strong>
        </div>
        <div class="hud-actions" aria-label="Acciones de la partida">
          <button
            id="settingsButton"
            class="icon-button icon-button--settings"
            type="button"
            aria-label="Abrir ajustes"
          aria-controls="settingsPanel"
          aria-expanded="false"
          >
            <svg
              class="hud-icon hud-icon--settings"
              viewBox="0 0 256 256"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M111 37h34v17c6 1 12 4 17 7l12-12 24 24-12 12c3 5 6 11 7 17h17v34h-17c-1 6-4 12-7 17l12 12-24 24-12-12c-5 3-11 6-17 7v17h-34v-17c-6-1-12-4-17-7l-12 12-24-24 12-12c-3-5-6-11-7-17H46V102h17c1-6 4-12 7-17L58 73l24-24 12 12c5-3 11-6 17-7V37Z"
                stroke-linejoin="round"
              />
              <circle cx="128" cy="119" r="34" fill="#061629" stroke="#B8F8FF" stroke-width="8" />
            </svg>
          </button>
          <button
            id="pauseButton"
            class="icon-button icon-button--pause"
            type="button"
          aria-label="Pausar partida"
          disabled
          >
            <svg
              class="hud-icon hud-icon--pause-bars"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="4" y="3" width="6" height="18" />
              <rect x="14" y="3" width="6" height="18" />
            </svg>
            <svg
              class="hud-icon hud-icon--resume"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M7 4.5 19 12 7 19.5V4.5Z" />
            </svg>
          </button>
        </div>
      </header>

      <section id="gameStage" class="game-stage" aria-label="Área de juego">
        <canvas
          id="gameCanvas"
          width="360"
          height="600"
          tabindex="0"
          aria-label="Neon Breaker. Desliza o usa flechas y A/D para mover la plataforma. Toca o pulsa Espacio para lanzar."
        ></canvas>

        <div id="effectsPanel" class="effects-panel" hidden></div>
        <div
          id="effectAnnouncements"
          class="sr-only"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>

        <button
          id="fireButton"
          class="fire-button"
          type="button"
          aria-label="Disparar proyectiles"
          hidden
        >
          <span aria-hidden="true">▲</span>
          FUEGO
        </button>

        <div
          id="screenOverlay"
          class="screen-overlay"
          role="dialog"
          aria-modal="true"
          aria-labelledby="overlayTitle"
          aria-describedby="overlayMessage"
        >
          <div id="overlayPanel" class="panel">
            <p id="overlayEyebrow" class="panel-eyebrow">ARCADE MÓVIL</p>
            <h1 id="overlayTitle">NEON<br>BREAKER</h1>
            <p id="overlayMessage">
              Rompe todos los bloques.<br>
              Desliza para mover la plataforma.
            </p>
            <section id="levelSelector" class="level-selector" aria-label="Niveles finalizados" hidden>
              <p id="levelSelectorStatus" class="level-selector-status"></p>
              <div id="levelGrid" class="level-grid" role="list"></div>
            </section>
            <div class="overlay-actions">
              <button id="overlayButton" class="primary-button" type="button">JUGAR</button>
              <button
                id="restartLevelButton"
                class="secondary-button"
                type="button"
                hidden
              >
                REINICIAR NIVEL
              </button>
              <button id="chooseLevelButton" class="secondary-button" type="button" hidden>
                ELEGIR NIVEL
              </button>
              <button id="backToPauseButton" class="secondary-button" type="button" hidden>
                VOLVER
              </button>
            </div>
          </div>
        </div>

        <p id="launchHint" class="launch-hint" hidden>TOCA PARA LANZAR</p>
      </section>

      <div id="settingsPanel" class="settings-overlay" hidden>
        <section
          class="settings-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="settingsTitle"
        >
          <p class="panel-eyebrow">PREFERENCIAS</p>
          <h2 id="settingsTitle">AJUSTES</h2>

          <button
            id="controlModeButton"
            class="setting-toggle"
            type="button"
            aria-pressed="false"
          >
            CONTROL: DIRECTO
          </button>
          <p id="controlModeHelp" class="setting-help">
            La plataforma sigue la posición horizontal del dedo.
          </p>

          <div class="settings-actions">
            <button
              id="soundButton"
              class="setting-toggle"
              type="button"
              aria-pressed="true"
            >
              SONIDO: SÍ
            </button>
            <button
              id="vibrationButton"
              class="setting-toggle"
              type="button"
              aria-pressed="true"
            >
              VIBRACIÓN: SÍ
            </button>
          </div>

          <button id="closeSettingsButton" class="primary-button" type="button">
            CERRAR
          </button>
        </section>
      </div>
    </main>

    <aside id="debugPanel" class="debug-panel" aria-label="Panel de depuración de efectos" hidden>
      <strong>DEBUG · OBJETOS</strong>
      <p>Generar sobre la plataforma:</p>
      <div id="debugButtons" class="debug-buttons"></div>
      <output id="debugStatus">Bolas: 0 · Objetos: 0</output>
    </aside>

    <script src="js/ball.js"></script>
    <script src="js/paddle.js"></script>
    <script src="js/brick.js"></script>
    <script src="js/effect-catalog.js"></script>
    <script src="js/falling-item.js"></script>
    <script src="js/falling-object-system.js"></script>
    <script src="js/projectile.js"></script>
    <script src="js/collision-system.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/level-manager.js"></script>
    <script src="js/input-manager.js"></script>
    <script src="js/effect-manager.js"></script>
    <script src="js/audio-manager.js"></script>
    <script src="js/vibration-manager.js"></script>
    <script src="js/storage-manager.js"></script>
    <script src="js/game-loop.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
